<style>
:root {
  --bg:#06060A; --s0:#0C0C12; --s1:#111118; --s2:#1A1A22;
  --border:#1E1E28; --border2:#2A2A38;
  --male-bg:#08091A; --female-bg:#140808;
  --male-bd:#1A2540; --female-bd:#2E1010;
  --txt:#F0F0F8; --txt2:#9090A8; --txt3:#5A5A72;
  --accent:#9A8A70; --accent2:#C8B898; --accent-d:#3A3020;
  --line:#20202A; --line2:#2E2E3A; --r:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,'PingFang SC','SF Pro Display','Helvetica Neue','Microsoft YaHei UI',sans-serif;
  background:var(--bg);overflow:hidden;height:100vh;width:100vw;
  color:var(--txt);-webkit-font-smoothing:antialiased;
}

/* ── HEADER ── */
#hdr{position:fixed;top:0;left:0;right:0;z-index:200;height:54px;
  background:var(--bg);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 24px}
#hdr-title{font-size:12px;font-weight:500;letter-spacing:5px;color:var(--accent2);opacity:.9;text-transform:uppercase}
#hdr-right{display:flex;gap:10px;align-items:center}
#adminBadge{display:none;color:var(--accent);font-size:10px;font-weight:500;letter-spacing:2px;
  border:1px solid var(--accent-d);padding:3px 10px;border-radius:20px}
#loginBtn{background:transparent;border:1px solid var(--border2);color:var(--txt2);
  padding:5px 15px;border-radius:20px;cursor:pointer;font-size:12px;
  letter-spacing:1.5px;font-family:inherit;transition:all .2s}
#loginBtn:hover{border-color:var(--accent-d);color:var(--accent)}

/* ── CANVAS ── */
#canvas{position:fixed;top:54px;left:0;right:0;bottom:0;overflow:hidden;cursor:grab;touch-action:none;background:var(--bg)}
#canvas::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 50% 40% at 20% 80%,rgba(154,138,112,.04) 0%,transparent 100%)}
#canvas:active{cursor:grabbing}
#svgWrap{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}

/* ── LOADING ── */
#loading{position:fixed;inset:0;z-index:900;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#loading .spin{width:28px;height:28px;border:1.5px solid var(--border2);border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{font-size:12px;color:var(--txt3);letter-spacing:2px}

/* ── SETUP SCREEN ── */
#setup{position:fixed;inset:0;z-index:800;background:var(--bg);display:none;
  align-items:center;justify-content:center;padding:24px}
#setup .box{background:var(--s0);border:1px solid var(--border2);border-radius:14px;
  padding:32px;width:min(480px,100%);max-height:90vh;overflow-y:auto}
#setup h2{font-size:14px;font-weight:500;letter-spacing:3px;color:var(--accent2);margin-bottom:6px}
#setup p{font-size:12px;color:var(--txt3);line-height:1.8;margin-bottom:20px;letter-spacing:.5px}
#setup code{display:block;background:var(--bg);border:1px solid var(--border);border-radius:6px;
  padding:14px 16px;font-size:11px;color:var(--txt2);white-space:pre;overflow-x:auto;
  font-family:'SF Mono','Fira Code',monospace;line-height:1.7;margin-bottom:16px}
#setup .hint{font-size:11px;color:var(--txt3);letter-spacing:.5px}

/* ── EMPTY ── */
#emptyState{position:fixed;inset:54px 0 0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;pointer-events:none;text-align:center;gap:12px}
#emptyState .mark{width:52px;height:52px;border-radius:50%;border:1px solid var(--border2);
  display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--txt3)}
#emptyState h3{font-size:13px;font-weight:400;letter-spacing:4px;color:var(--txt2)}
#emptyState p{font-size:12px;color:var(--txt3);line-height:1.8;letter-spacing:.5px}

/* ── FAB ── */
#fab{display:none;position:fixed;bottom:28px;right:28px;z-index:300;
  width:46px;height:46px;border-radius:50%;background:var(--s2);
  border:1px solid var(--border2);color:var(--accent);font-size:22px;cursor:pointer;
  align-items:center;justify-content:center;transition:all .2s;
  box-shadow:0 4px 24px rgba(0,0,0,.5)}
#fab:hover{border-color:var(--accent-d)}

/* ── LEGEND ── */
#legend{position:fixed;bottom:20px;left:20px;z-index:100;
  background:rgba(6,6,10,.9);border:1px solid var(--border);border-radius:8px;
  padding:10px 14px;font-size:11px;color:var(--txt3);pointer-events:none;letter-spacing:.5px}
#legend div{display:flex;align-items:center;gap:8px;margin:3px 0}
.lm{width:10px;height:10px;border-radius:2px;background:var(--male-bg);border:1px solid var(--male-bd)}
.lf{width:10px;height:10px;border-radius:2px;background:var(--female-bg);border:1px solid var(--female-bd)}

/* ── SYNC BADGE ── */
#syncBadge{position:fixed;top:62px;right:16px;z-index:100;
  font-size:10px;color:var(--txt3);letter-spacing:1px;padding:3px 8px;
  border-radius:4px;opacity:0;transition:opacity .3s;pointer-events:none}
#syncBadge.show{opacity:1}

/* ── CONTEXT MENU ── */
#ctxMenu{position:fixed;z-index:500;background:var(--s0);border:1px solid var(--border2);
  border-radius:10px;box-shadow:0 12px 48px rgba(0,0,0,.9);
  padding:5px 0;min-width:168px;display:none;animation:ctxIn .1s ease}
@keyframes ctxIn{from{opacity:0;transform:scale(.96) translateY(-3px)}to{opacity:1;transform:none}}
#ctxMenu .sect{padding:5px 14px 3px;font-size:10px;letter-spacing:2.5px;color:var(--txt3);text-transform:uppercase}
#ctxMenu button{display:block;width:100%;padding:9px 16px;background:none;border:none;
  text-align:left;font-size:12px;cursor:pointer;color:var(--txt2);
  font-family:inherit;letter-spacing:.5px;transition:background .1s,color .1s}
#ctxMenu button:hover{background:var(--s1);color:var(--txt)}
#ctxMenu button.danger{color:#6A3030}
#ctxMenu button.danger:hover{background:rgba(120,30,30,.15);color:#C05050}
#ctxMenu hr{border:none;border-top:1px solid var(--border);margin:4px 0}

/* ── OVERLAY / MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.overlay.open{display:flex}
.modal{background:var(--s0);border:1px solid var(--border2);border-radius:14px;padding:28px;
  width:min(440px,100%);max-height:88vh;overflow-y:auto;
  box-shadow:0 24px 80px rgba(0,0,0,.95);animation:mdIn .18s ease}
@keyframes mdIn{from{opacity:0;transform:translateY(12px)scale(.98)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;gap:10px;padding-bottom:18px;margin-bottom:20px;border-bottom:1px solid var(--border)}
.modal-line{width:2px;height:16px;background:var(--accent);border-radius:1px;opacity:.7}
.modal-head h2{font-size:14px;font-weight:500;letter-spacing:2px;color:var(--txt)}
.fgrp{margin-bottom:14px}
.fgrp label{display:block;font-size:10px;color:var(--txt3);margin-bottom:6px;letter-spacing:2.5px;text-transform:uppercase}
.fgrp input,.fgrp select,.fgrp textarea{width:100%;padding:9px 12px;background:var(--bg);
  border:1px solid var(--border);color:var(--txt);border-radius:7px;font-size:13px;outline:none;
  font-family:inherit;letter-spacing:.3px;transition:border-color .2s;-webkit-appearance:none}
.fgrp input:focus,.fgrp select:focus,.fgrp textarea:focus{border-color:var(--accent-d)}
.fgrp select option{background:var(--s0)}
.fgrp textarea{resize:vertical;min-height:64px}
.fgrp.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn-row{display:flex;gap:8px;margin-top:22px}
.btn{flex:1;padding:10px;border:none;border-radius:7px;font-size:12px;cursor:pointer;
  font-weight:500;font-family:inherit;letter-spacing:1px;transition:opacity .15s}
.btn-p{background:var(--accent-d);color:var(--accent2);border:1px solid var(--accent-d)}
.btn-p:hover{background:#4A3E28}
.btn-s{background:transparent;color:var(--txt2);border:1px solid var(--border)}
.btn-s:hover{border-color:var(--border2);color:var(--txt)}
.btn-d{background:transparent;color:#7A3030;border:1px solid #2A1010;flex:0 0 auto;padding:10px 14px}
.btn-d:hover{background:rgba(120,30,30,.12);color:#C05050}
.hint{font-size:11px;color:var(--txt3);text-align:center;margin-top:14px;letter-spacing:.5px}
.modal::-webkit-scrollbar{width:3px}
.modal::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ── TOAST ── */
#toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);
  background:var(--s1);border:1px solid var(--border2);color:var(--txt2);
  padding:8px 20px;border-radius:20px;font-size:12px;letter-spacing:.5px;
  z-index:2000;opacity:0;pointer-events:none;transition:opacity .2s;
  white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.6)}
</style>
</head>
<body>

<div id="hdr">
  <span id="hdr-title">家族族谱</span>
  <div id="hdr-right">

<script>
'use strict';

// ═══════════════════════════════════════════════════════
//  ① 填写你的腾讯云开发环境 ID（从控制台复制，见下方说明）
// ═══════════════════════════════════════════════════════
const CB_ENV = 'familytree-zhang-d4egjimff7a6dd1';
// ═══════════════════════════════════════════════════════

const IS_CONFIGURED = !CB_ENV.startsWith('YOUR_');
let cbCol = null, ftDocId = null;

const DEFAULT_DB = { admin:{ u:'zhang990', p:'zhang318' }, persons:[], nid:1 };
let db = { ...DEFAULT_DB };

async function initCloudBase() {
  if (!IS_CONFIGURED) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('setup').style.display = 'flex';
    return;
  }

  try {
    const app = cloudbase.init({ env: CB_ENV });
    const auth = app.auth({ persistence: 'local' });
    const state = await auth.getLoginState();
    if (!state) await auth.anonymousAuthProvider().signIn();

    const cbDb = app.database();
    cbCol = cbDb.collection('familytree');

    // 读取已有数据
    console.log("init: querying collection"); const res = await cbCol.limit(1).get(); console.log("init: res=", JSON.stringify(res?.data?.length));
    if (res.data && res.data.length > 0) {
      ftDocId = res.data[0]._id; console.log("init: loaded doc", ftDocId);
      db = JSON.parse(res.data[0].payload);
    } else {
      // 第一次：新建文档
      const addRes = await cbCol.add({ payload: JSON.stringify(db) }); console.log("init: created doc", addRes);
      ftDocId = addRes.id;
    }

    document.getElementById('loading').style.display = 'none';
    renderTree();

    // 每 8 秒同步一次
    setInterval(async () => {
      if (!ftDocId || document.querySelector('.overlay.open')) return;
      try {
        const r = await cbCol.doc(ftDocId).get();
        if (r.data) {
          db = JSON.parse(r.data.payload);
          renderTree(); showSync();
        }
      } catch(e) {}
    }, 8000);

  } catch(err) {
    console.error('CloudBase error:', err);
    document.getElementById('loading').style.display = 'none';
    toast('连接失败：' + err.message);
    renderTree();
  }
}

function save() {
  console.log('save called, ftDocId=', ftDocId, 'cbCol=', !!cbCol);
  if (!cbCol || !ftDocId) { toast('未连接到数据库，请刷新页面'); return; }
  cbCol.doc(ftDocId).set({ payload: JSON.stringify(db) })
    .then(() => showSync())
    .catch(e => { toast('保存失败：' + e.message); console.error('save error:', e); });
}

let syncTimer;
function showSync() {
  const b = document.getElementById('syncBadge');
  b.classList.add('show');
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => b.classList.remove('show'), 1800);
}

// ── DATA ──
function mkId()  { return 'n' + (db.nid++); }
function get(id) { return db.persons.find(x => x.id === id) || null; }
function kids(pid){ return db.persons.filter(p => p.fid === pid || p.mid === pid); }
function roots() { return db.persons.filter(p => !p.fid && !p.mid); }

function addP(d) {
  const p = {
    id: mkId(), name: d.name||'未知', gender: d.gender||'male',
    sub: d.sub||'', birth: d.birth||'', death: d.death||'',
    note: d.note||'', fid: d.fid||null, mid: d.mid||null, sid: d.sid||null
  };
  db.persons.push(p); save(); return p;
}
function upd(id, d) { const p = get(id); if(p){ Object.assign(p,d); save(); } }
function del(id) {
  const p = get(id); if(!p) return;
  if(p.sid){ const s=get(p.sid); if(s&&s.sid===id) s.sid=null; }
  db.persons.forEach(x => {
    if(x.fid===id) x.fid=null;
    if(x.mid===id) x.mid=null;
    if(x.sid===id) x.sid=null;
  });
  db.persons = db.persons.filter(x => x.id !== id);
  save();
}

// ── AUTH ──
let isAdmin = false;
function openLogin() {
  if(isAdmin){ logout(); return; }
  document.getElementById('lu').value='';
  document.getElementById('lp').value='';
  openOv('loginOverlay');
  setTimeout(() => document.getElementById('lu').focus(), 150);
}
function doLogin() {
  const u=document.getElementById('lu').value.trim(), p=document.getElementById('lp').value;
  if(u===db.admin.u && p===db.admin.p){
    isAdmin=true;
    document.getElementById('loginBtn').textContent='退出';
    document.getElementById('adminBadge').style.display='inline-block';
    const f=document.getElementById('fab');
    f.style.display='flex'; f.style.alignItems='center'; f.style.justifyContent='center';
    closeOv('loginOverlay'); renderTree(); toast('已进入管理模式');
  } else toast('账号或密码错误');
}
function logout() {
  isAdmin=false;
  document.getElementById('loginBtn').textContent='登录';
  document.getElementById('adminBadge').style.display='none';
  document.getElementById('fab').style.display='none';
  renderTree(); toast('已退出管理模式');
}

// ── LAYOUT ──
const NW=130,NH=60,HG=50,VG=90,CG=14;
let pos={},wc={};

function ckids(pid){
  const p=get(pid); if(!p) return[];
  const m=kids(pid);
  if(p.sid) kids(p.sid).forEach(c=>{ if(!m.find(x=>x.id===c.id)) m.push(c); });
  return m;
}
function sw(pid){
  if(wc[pid]!==undefined) return wc[pid];
  const p=get(pid); if(!p) return NW;
  const hasSp=!!(p.sid&&get(p.sid));
  const ow=hasSp?NW*2+CG:NW;
  const ks=ckids(pid); if(!ks.length) return wc[pid]=ow;
  const kw=ks.reduce((s,c,i)=>s+sw(c.id)+(i?HG:0),0);
  return wc[pid]=Math.max(ow,kw);
}
function lay(pid,x,y,done){
  if(done.has(pid)) return; done.add(pid);
  const p=get(pid); if(!p) return;
  pos[pid]={x,y};
  if(p.sid&&!done.has(p.sid)){ done.add(p.sid); pos[p.sid]={x:x+NW+CG,y}; }
  const ks=ckids(pid); if(!ks.length) return;
  const kws=ks.map(c=>sw(c.id));
  const tot=kws.reduce((a,b)=>a+b,0)+HG*(ks.length-1);
  const hasSp=!!(p.sid&&get(p.sid));
  const cx=hasSp?x+NW+CG/2:x+NW/2;
  let kx=cx-tot/2;
  ks.forEach((c,i)=>{ lay(c.id,kx,y+NH+VG,done); kx+=kws[i]+HG; });
}
function layout(){
  pos={}; wc={}; const done=new Set(); let rx=70;
  roots().forEach(r=>{
    if(done.has(r.id)) return;
    if(r.sid){
      const s=get(r.sid);
      if(s&&!s.fid&&!s.mid){
        if(r.gender==='female'&&s.gender==='male') return;
        if(r.gender===s.gender&&r.id>s.id) return;
      }
    }
    lay(r.id,rx,70,done); rx+=sw(r.id)+HG*2;
  });
}

// ── RENDER ──
let svgW=0,svgH=0;

function renderTree(){
  const svg=document.getElementById('treeSvg');
  svg.innerHTML='';
  const em=document.getElementById('emptyState');
  if(!db.persons.length){ em.style.display='flex'; return; }
  em.style.display='none';
  layout();

  let mx=0,my=0;
  db.persons.forEach(p=>{ const q=pos[p.id]; if(!q) return; mx=Math.max(mx,q.x+NW*2+CG); my=Math.max(my,q.y+NH); });
  svgW=mx+80; svgH=my+80;
  svg.setAttribute('width',svgW); svg.setAttribute('height',svgH);

  const defs=el('defs');
  mkGrad(defs,'mg','#090E1C','#060810');
  mkGrad(defs,'fg','#130809','#0A0505');
  const ag=el('linearGradient',{id:'ag',x1:'0%',y1:'0%',x2:'100%',y2:'0%'});
  sc(ag,['0%','rgba(154,138,112,0)'],['50%','rgba(154,138,112,0.55)'],['100%','rgba(154,138,112,0)']);
  defs.appendChild(ag);
  svg.appendChild(defs);

  const LG=el('g'), NG=el('g');
  svg.appendChild(LG); svg.appendChild(NG);

  const dc=new Set(), df=new Set();

  db.persons.forEach(p=>{
    const q=pos[p.id]; if(!q) return;

    // Marriage line
    if(p.sid&&pos[p.sid]){
      const key=[p.id,p.sid].sort().join('|');
      if(!dc.has(key)){ dc.add(key);
        const s=pos[p.sid],x1=q.x+NW,x2=s.x,ly=q.y+NH/2,mx2=(x1+x2)/2;
        if(isAdmin){
          const z=el('rect',{x:x1,y:ly-14,width:x2-x1,height:28,fill:'transparent',style:'cursor:pointer'});
          z.addEventListener('click',e=>{ e.stopPropagation(); openChild(p.gender==='male'?p.id:p.sid); });
          LG.appendChild(z);
        }
        LG.appendChild(el('line',{x1,y1:ly,x2:mx2-7,y2:ly,stroke:'#2A2A3A','stroke-width':'1','stroke-dasharray':'4,3'}));
        LG.appendChild(el('line',{x1:mx2+7,y1:ly,x2,y2:ly,stroke:'#2A2A3A','stroke-width':'1','stroke-dasharray':'4,3'}));
        const d=el('text',{x:mx2,y:ly+4,'text-anchor':'middle','font-size':'8',fill:'#9A8A70',style:'pointer-events:none'});
        d.textContent='◆'; LG.appendChild(d);
      }
    }

    // Parent→child lines
    const fk=p.sid?[p.id,p.sid].sort().join('|'):p.id;
    if(!df.has(fk)){ df.add(fk);
      const ks=ckids(p.id).filter(c=>pos[c.id]);
      if(ks.length){
        const hasSp=!!(p.sid&&pos[p.sid]);
        const pcx=hasSp?q.x+NW+CG/2:q.x+NW/2;
        const ty=q.y+NH, my2=ty+VG/2;
        LG.appendChild(el('line',{x1:pcx,y1:ty,x2:pcx,y2:my2,stroke:'var(--line2)','stroke-width':'1'}));
        if(ks.length>1){
          const xs=ks.map(c=>pos[c.id].x+NW/2);
          LG.appendChild(el('line',{x1:Math.min(...xs),y1:my2,x2:Math.max(...xs),y2:my2,stroke:'var(--line2)','stroke-width':'1'}));
        }
        ks.forEach(c=>{
          const cp=pos[c.id],cx=cp.x+NW/2;
          if(ks.length===1){
            LG.appendChild(el('path',{d:`M${pcx},${ty} C${pcx},${my2} ${cx},${my2} ${cx},${cp.y}`,stroke:'var(--line2)','stroke-width':'1',fill:'none'}));
          } else {
            if(isAdmin){
              const z=el('rect',{x:cx-10,y:my2,width:20,height:cp.y-my2,fill:'transparent',style:'cursor:pointer'});
              z.addEventListener('click',e=>{ e.stopPropagation(); openChild(p.id); });
              LG.appendChild(z);
            }
            LG.appendChild(el('line',{x1:cx,y1:my2,x2:cx,y2:cp.y,stroke:'var(--line2)','stroke-width':'1'}));
          }
        });
      }
    }
  });

  // Person nodes
  db.persons.forEach(p=>{
    const q=pos[p.id]; if(!q) return;
    const male=p.gender==='male';
    const g=el('g',{transform:`translate(${q.x},${q.y})`});

    g.appendChild(el('rect',{width:NW,height:NH,rx:'8',ry:'8',
      fill:male?'url(#mg)':'url(#fg)',stroke:male?'#1A2540':'#2E1010','stroke-width':'1'}));
    g.appendChild(el('rect',{x:NW*.25,y:0,width:NW*.5,height:'1',fill:'url(#ag)',opacity:'.9'}));
    g.appendChild(el('circle',{cx:'10',cy:'10',r:'2',fill:male?'#1A3060':'#501818',opacity:'.8'}));

    const hasMeta=p.birth||p.sub;
    const nt=el('text',{x:NW/2,y:hasMeta?'24':'34','text-anchor':'middle',
      'font-size':'14','font-weight':'500','letter-spacing':'1',
      fill:'#D8D0C0',style:'pointer-events:none'});
    nt.textContent=p.name.length>7?p.name.slice(0,7)+'…':p.name;
    g.appendChild(nt);

    if(p.sub||p.birth){
      const st=el('text',{x:NW/2,y:'42','text-anchor':'middle','font-size':'10',
        'letter-spacing':'.5','fill':'#3A3A50',style:'pointer-events:none'});
      st.textContent=p.sub||(p.birth+(p.death?' — '+p.death:''));
      g.appendChild(st);
    }
    if(p.note) g.appendChild(el('circle',{cx:NW-8,cy:'8',r:'2.5',fill:'#9A8A70',opacity:'.6'}));
    if(p.death) g.appendChild(el('rect',{x:1,y:1,width:NW-2,height:NH-2,rx:'7',fill:'rgba(0,0,0,.3)',style:'pointer-events:none'}));

    if(isAdmin){
      g.style.cursor='pointer';
      g.addEventListener('click',e=>{ e.stopPropagation(); showCtx(e.clientX,e.clientY,p.id); });
      let lt;
      g.addEventListener('touchstart',e=>{ lt=setTimeout(()=>{ const t=e.touches[0]; showCtx(t.clientX,t.clientY,p.id); },500); });
      g.addEventListener('touchend',()=>clearTimeout(lt));
      g.addEventListener('touchmove',()=>clearTimeout(lt));
    }
    NG.appendChild(g);
  });

  fitView();
}

function el(tag,a={}){
  const e=document.createElementNS('http://www.w3.org/2000/svg',tag);
  Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v)); return e;
}
function sc(g,...stops){ stops.forEach(([o,c])=>{ const s=el('stop'); s.setAttribute('offset',o); s.setAttribute('stop-color',c); g.appendChild(s); }); }
function mkGrad(defs,id,c1,c2){
  const g=el('linearGradient',{id,x1:'0%',y1:'0%',x2:'100%',y2:'100%'});
  sc(g,['0%',c1],['100%',c2]); defs.appendChild(g);
}

// ── PAN & ZOOM ──
let tf={x:0,y:0,s:1},pan=false,lxy={x:0,y:0};
function applyTf(){ document.getElementById('svgWrap').style.transform=`translate(${tf.x}px,${tf.y}px)scale(${tf.s})`; }
function fitView(){
  const c=document.getElementById('canvas'),cw=c.clientWidth,ch=c.clientHeight;
  const s=Math.min(cw/(svgW||cw),ch/(svgH||ch),1)*.88;
  tf.s=s; tf.x=(cw-svgW*s)/2; tf.y=Math.max((ch-svgH*s)/2,20); applyTf();
}
const cv=document.getElementById('canvas');
cv.addEventListener('mousedown',e=>{ pan=true; lxy={x:e.clientX,y:e.clientY}; });
cv.addEventListener('mousemove',e=>{ if(!pan) return; tf.x+=e.clientX-lxy.x; tf.y+=e.clientY-lxy.y; lxy={x:e.clientX,y:e.clientY}; applyTf(); });
cv.addEventListener('mouseup',()=>pan=false);
cv.addEventListener('mouseleave',()=>pan=false);
cv.addEventListener('wheel',e=>{
  e.preventDefault(); const d=e.deltaY>0?.88:1.12;
  const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
  tf.x=px-(px-tf.x)*d; tf.y=py-(py-tf.y)*d;
  tf.s=Math.min(Math.max(tf.s*d,.07),6); applyTf();
},{passive:false});
let lt2=[],ld=0;
cv.addEventListener('touchstart',e=>{ e.preventDefault(); lt2=Array.from(e.touches); if(e.touches.length===2) ld=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); },{passive:false});
cv.addEventListener('touchmove',e=>{
  e.preventDefault(); const ts=Array.from(e.touches);
  if(ts.length===1&&lt2.length>=1){ tf.x+=ts[0].clientX-lt2[0].clientX; tf.y+=ts[0].clientY-lt2[0].clientY; }
  else if(ts.length===2){
    const d=Math.hypot(ts[0].clientX-ts[1].clientX,ts[0].clientY-ts[1].clientY);
    const sc2=d/(ld||d);
    const cx=(ts[0].clientX+ts[1].clientX)/2,cy=(ts[0].clientY+ts[1].clientY)/2;
    const r=cv.getBoundingClientRect(),px=cx-r.left,py=cy-r.top;
    tf.x=px-(px-tf.x)*sc2; tf.y=py-(py-tf.y)*sc2;
    tf.s=Math.min(Math.max(tf.s*sc2,.07),6);
    const pc=lt2.length>=2?[(lt2[0].clientX+lt2[1].clientX)/2,(lt2[0].clientY+lt2[1].clientY)/2]:[lt2[0].clientX,lt2[0].clientY];
    tf.x+=cx-pc[0]; tf.y+=cy-pc[1]; ld=d;
  }
  lt2=ts; applyTf();
},{passive:false});
cv.addEventListener('touchend',e=>{ lt2=Array.from(e.touches); });

// ── CONTEXT MENU ──
let ctxId=null;
function showCtx(cx,cy,pid){
  ctxId=pid; const p=get(pid),m=document.getElementById('ctxMenu');
  document.getElementById('ctx-father').style.display=(!p||p.fid)?'none':'block';
  document.getElementById('ctx-mother').style.display=(!p||p.mid)?'none':'block';
  document.getElementById('ctx-spouse').style.display=(!p||p.sid)?'none':'block';
  m.style.display='block';
  let x=cx,y=cy;
  if(x+180>innerWidth) x-=180;
  if(y+220>innerHeight) y-=220;
  m.style.left=x+'px'; m.style.top=y+'px';
}
function hideCtx(){ document.getElementById('ctxMenu').style.display='none'; }
document.addEventListener('click',hideCtx);
document.addEventListener('touchstart',e=>{ if(!document.getElementById('ctxMenu').contains(e.target)) hideCtx(); });
function ctxDo(a){
  hideCtx(); if(!ctxId) return;
  ({edit:()=>openEdit(ctxId),addFather:()=>openParent(ctxId,'father'),addMother:()=>openParent(ctxId,'mother'),
    addSpouse:()=>openSpouse(ctxId),addChild:()=>openChild(ctxId),delete:()=>confDel(ctxId)})[a]?.();
}

// ── FORMS ──
function clrForm(){
  ['pId','pFid','pMid','pSpouseOf','pParentOf','pParentRole'].forEach(i=>document.getElementById(i).value='');
  ['pName','pSub','pBirth','pDeath','pNote'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('pGender').value='male';
  document.getElementById('pDelBtn').style.display='none';
}
function openAddRoot(){ clrForm(); document.getElementById('pTitle').textContent='添加始祖'; openOv('personOverlay'); setTimeout(()=>document.getElementById('pName').focus(),150); }
function openChild(pid){
  clrForm(); const par=get(pid); if(!par) return;
  document.getElementById('pTitle').textContent=`添加子女 — ${par.name}`;
  if(par.gender==='male'){ document.getElementById('pFid').value=pid; if(par.sid) document.getElementById('pMid').value=par.sid; }
  else{ document.getElementById('pMid').value=pid; if(par.sid) document.getElementById('pFid').value=par.sid; }
  openOv('personOverlay'); setTimeout(()=>document.getElementById('pName').focus(),150);
}
function openParent(pid,role){
  clrForm(); const p=get(pid); if(!p) return;
  if(role==='father'&&p.fid){ toast('此人已有父亲记录'); return; }
  if(role==='mother'&&p.mid){ toast('此人已有母亲记录'); return; }
  document.getElementById('pTitle').textContent=`为 ${p.name} 添加${role==='father'?'父亲':'母亲'}`;
  document.getElementById('pGender').value=role==='father'?'male':'female';
  document.getElementById('pParentOf').value=pid;
  document.getElementById('pParentRole').value=role;
  openOv('personOverlay'); setTimeout(()=>document.getElementById('pName').focus(),150);
}
function openSpouse(pid){
  clrForm(); const p=get(pid); if(!p) return;
  if(p.sid){ toast('此人已有配偶'); return; }
  document.getElementById('pTitle').textContent=`为 ${p.name} 添加配偶`;
  document.getElementById('pGender').value=p.gender==='male'?'female':'male';
  document.getElementById('pSpouseOf').value=pid;
  openOv('personOverlay'); setTimeout(()=>document.getElementById('pName').focus(),150);
}
function openEdit(pid){
  const p=get(pid); if(!p) return; clrForm();
  document.getElementById('pTitle').textContent=`编辑 · ${p.name}`;
  document.getElementById('pId').value=p.id;
  document.getElementById('pName').value=p.name;
  document.getElementById('pGender').value=p.gender;
  document.getElementById('pSub').value=p.sub||'';
  document.getElementById('pBirth').value=p.birth||'';
  document.getElementById('pDeath').value=p.death||'';
  document.getElementById('pNote').value=p.note||'';
  document.getElementById('pDelBtn').style.display='inline-block';
  openOv('personOverlay'); setTimeout(()=>document.getElementById('pName').focus(),150);
}
function savePerson(){
  try{
    const name=document.getElementById('pName').value.trim();
    if(!name){ toast('请填写姓名'); return; }
    const id=document.getElementById('pId').value;
    const d={ gender:document.getElementById('pGender').value, sub:document.getElementById('pSub').value.trim(),
      birth:document.getElementById('pBirth').value.trim(), death:document.getElementById('pDeath').value.trim(),
      note:document.getElementById('pNote').value.trim() };
    if(id){ upd(id,{name,...d}); toast('已保存'); }
    else{
      const fid=document.getElementById('pFid').value||null;
      const mid=document.getElementById('pMid').value||null;
      const sp=document.getElementById('pSpouseOf').value||null;
      const po=document.getElementById('pParentOf').value||null;
      const pr=document.getElementById('pParentRole').value||null;
      const np=addP({name,...d,fid,mid});
      if(sp){ upd(np.id,{sid:sp}); upd(sp,{sid:np.id}); }
      if(po&&pr) upd(po,{[pr==='father'?'fid':'mid']:np.id});
      toast(`已添加 ${name}`);
    }
    closeOv('personOverlay'); renderTree();
  } catch(e){ toast('保存失败：'+e.message); console.error(e); }
}
function delCurrent(){ confDel(document.getElementById('pId').value); }
function confDel(id){
  const p=get(id); if(!p) return;
  if(!confirm(`确定删除「${p.name}」？`)) return;
  closeOv('personOverlay'); del(id); renderTree(); toast(`已删除 ${p.name}`);
}

// ── MODAL ──
function openOv(id){ const e=document.getElementById(id); e.classList.add('open'); e.onclick=ev=>{ if(ev.target===e) closeOv(id); }; }
function closeOv(id){ document.getElementById(id).classList.remove('open'); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeOv('loginOverlay'); closeOv('personOverlay'); hideCtx(); } });

// ── TOAST ──
let tt;
function toast(msg){ const e=document.getElementById('toast'); e.textContent=msg; e.style.opacity='1'; clearTimeout(tt); tt=setTimeout(()=>e.style.opacity='0',2200); }

// ── START ──
initCloudBase();
